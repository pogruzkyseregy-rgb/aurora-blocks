<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AvrorA Blocks</title>
<style>
html,body{margin:0;height:100%;background:#03040a;overflow:hidden;font-family:"Courier New",monospace;color:#bff6ff;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
canvas{max-height:80vh;max-width:100vw;aspect-ratio:520/660;box-shadow:0 0 40px #3ff3ff22;border-radius:4px}
#pad{display:none;gap:8px}
#pad button{width:60px;height:50px;background:#05101a;color:#3ff3ff;border:1px solid #3ff3ff;font-size:20px;border-radius:6px;box-shadow:0 0 10px #3ff3ff44 inset;font-family:inherit}
#pad button:active{background:#0b2a3a}
@media (pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="520" height="660"></canvas>
  <div id="pad">
    <button data-k="left">◀</button>
    <button data-k="rot">⟳</button>
    <button data-k="right">▶</button>
    <button data-k="down">▼</button>
    <button data-k="drop">⤓</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=10,ROWS=20,CS=28,BX=40,BY=70,W=520,H=660;
const C={cyan:'#3ff3ff',pink:'#ff6fc1',violet:'#b77bff',white:'#f0fbff',blue:'#5b8cff',gold:'#ffe27a',red:'#ff3d6e'};

// 7 фигур — как на первом референсе (кубики с сакурой)
const SHAPES=[
  {m:[[1,1,1,1]],c:C.cyan},
  {m:[[1,1],[1,1]],c:C.white},
  {m:[[0,1,0],[1,1,1]],c:C.violet},
  {m:[[0,1,1],[1,1,0]],c:C.pink},
  {m:[[1,1,0],[0,1,1]],c:C.blue},
  {m:[[1,0,0],[1,1,1]],c:C.blue},
  {m:[[0,0,1],[1,1,1]],c:C.white}
];
const BON={shield:{c:C.gold,n:'ЩИТ'},slow:{c:C.cyan,n:'ЗАМЕДЛЕНИЕ'},bomb:{c:C.white,n:'ВСПЫШКА'}};
const DEB={glitch:{n:'ГЛИТЧ: УПРАВЛЕНИЕ ИНВЕРТИРОВАНО',d:5,c:C.red},fog:{n:'ПОМЕХИ: ПОЛЕ СКРЫТО',d:6,c:C.violet},surge:{n:'ПЕРЕГРУЗ: УСКОРЕНИЕ',d:5,c:C.pink}};
const TMAX={slow:8,fog:6,glitch:5,surge:5};
const TNAME={slow:'ЗАМЕДЛЕНИЕ',fog:'ПОМЕХИ',glitch:'ГЛИТЧ',surge:'ПЕРЕГРУЗ'};

let board,cur,nxt,score,lines,level,shield,over,paused,started,acc,banner,flash,lastT=0,clock=0;
const T={slow:0,fog:0,glitch:0,surge:0};
const petals=[];
for(let i=0;i<26;i++)petals.push({x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*2,vx:(Math.random()-.5)*0.6,vy:0.4+Math.random()*0.7});

const pick=a=>a[Math.floor(Math.random()*a.length)];
function say(t,d,col){banner={t,dur:d,col};}
function makePiece(){
  const s=pick(SHAPES);
  const bonus=Math.random()<0.13?pick(Object.keys(BON)):null;
  return{m:s.m.map(r=>r.slice()),c:s.c,x:0,y:0,bonus};
}
function collide(m,x,y){
  for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){
    if(!m[r][c])continue;
    const nx=x+c,ny=y+r;
    if(nx<0||nx>=COLS||ny>=ROWS)return true;
    if(ny>=0&&board[ny][nx])return true;
  }
  return false;
}
function rotate(m){
  const R=m.length,Cc=m[0].length;
  return Array.from({length:Cc},(_,c)=>Array.from({length:R},(_,r)=>m[R-1-r][c]));
}
function tryRotate(){
  const nm=rotate(cur.m);
  for(const k of [0,-1,1,-2,2]){
    if(!collide(nm,cur.x+k,cur.y)){cur.m=nm;cur.x+=k;return;}
  }
}
function move(d){if(!collide(cur.m,cur.x+d,cur.y))cur.x+=d;}

function spawn(){
  cur=nxt;nxt=makePiece();
  cur.x=Math.floor((COLS-cur.m[0].length)/2);cur.y=0;
  if(collide(cur.m,cur.x,cur.y)){over=true;return;}
  // дебафф с шансом, растёт с уровнем
  if(Math.random()<Math.min(0.1+level*0.025,0.3)){
    const k=pick(Object.keys(DEB));
    if(shield>0){shield--;say('ЩИТ ОТРАЗИЛ: '+DEB[k].n,2.2,C.gold);}
    else{T[k]=DEB[k].d;say(DEB[k].n,DEB[k].d,DEB[k].c);}
  }
}

function act(a){
  if(!started||over){start();return;}
  if(paused)return;
  const dx=T.glitch>0?1:-1;           // глитч инвертирует управление
  if(a==='left')move(dx);
  else if(a==='right')move(-dx);
  else if(a==='rot')tryRotate();
  else if(a==='down'){
    if(!collide(cur.m,cur.x,cur.y+1)){cur.y++;score++;acc=0;}
    else lock();
  }
  else if(a==='drop'){
    let n=0;
    while(!collide(cur.m,cur.x,cur.y+1)){cur.y++;n++;}
    score+=n*2;lock();
  }
}

function applyBonus(b,p){
  if(b==='shield'){shield=Math.min(3,shield+1);say('+1 ЩИТ',1.5,C.gold);}
  else if(b==='slow'){T.slow=8;say('ЗАМЕДЛЕНИЕ ВРЕМЕНИ 8с',2,C.cyan);}
  else{
    for(let y=p.y-1;y<=p.y+1;y++)for(let x=p.x-1;x<=p.x+1;x++)
      if(y>=0&&y<ROWS&&x>=0&&x<COLS)board[y][x]=null;
    score+=150*level;flash=0.5;say('ВСПЫШКА +'+150*level,1.5,C.white);
  }
}

function lock(){
  let first=null;
  cur.m.forEach((row,r)=>row.forEach((v,c)=>{
    if(!v)return;
    const x=cur.x+c,y=cur.y+r;
    if(y<0){over=true;return;}
    board[y][x]={c:cur.c,b:null};
    if(!first)first={x,y};
  }));
  if(over)return;
  if(cur.bonus&&first){board[first.y][first.x].b=cur.bonus;applyBonus(cur.bonus,first);}
  clearLines();
  spawn();
}

function clearLines(){
  let n=0;
  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(v=>v)){
      board.splice(y,1);board.unshift(Array(COLS).fill(null));n++;y++;
    }
  }
  if(n){
    lines+=n;
    score+=[0,100,300,500,800][n]*level;
    level=1+Math.floor(lines/10);
    flash=0.3;
    say(['','ОДИНОЧНЫЙ','ДВОЙНОЙ','ТРОЙНОЙ','ТЕТРИС АВРОРЫ'][n],1.5,C.cyan);
  }
}

function start(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  score=0;lines=0;level=1;shield=0;
  T.slow=T.fog=T.glitch=T.surge=0;
  over=false;paused=false;started=true;acc=0;flash=0;banner=null;
  nxt=makePiece();spawn();
  say('AVRORA BLOCKS — ПОГНАЛИ',1.6,C.cyan);
}

function update(dt){
  clock+=dt;
  for(const k in T)if(T[k]>0)T[k]=Math.max(0,T[k]-dt);
  if(banner){banner.dur-=dt;if(banner.dur<=0)banner=null;}
  if(flash>0)flash=Math.max(0,flash-dt);
  let iv=Math.max(80,700-(level-1)*55);
  if(T.surge>0)iv/=2;
  if(T.slow>0)iv*=2.5;
  acc+=dt*1000;
  if(acc>=iv){
    acc=0;
    if(!collide(cur.m,cur.x,cur.y+1))cur.y++;
    else lock();
  }
}

/* ---------- отрисовка ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function petal(x,y,r,rot,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();ctx.ellipse(0,0,r*0.55,r,0,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,180,215,${a})`;ctx.fill();ctx.restore();
}
function drawCell(px,py,col,a,mark,sz=CS){
  const p=sz/14;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createLinearGradient(px,py,px+sz,py+sz);
  g.addColorStop(0,col);g.addColorStop(1,'#0b1126');
  ctx.shadowColor=col;ctx.shadowBlur=12;
  ctx.fillStyle=g;rr(px+p,py+p,sz-2*p,sz-2*p,5);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.1)';rr(px+p,py+p,sz-2*p,(sz-2*p)/2,5);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=1.4;rr(px+p,py+p,sz-2*p,sz-2*p,5);ctx.stroke();
  petal(px+sz/2,py+sz/2,sz*0.2,0.6,0.6);
  if(mark){
    ctx.fillStyle=BON[mark].c;ctx.shadowColor=BON[mark].c;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(px+sz/2,py+sz/2,sz*0.16,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function hud(x,y,w,h,col){
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.5;
  ctx.shadowColor=col;ctx.shadowBlur=8;const k=14;
  ctx.beginPath();
  ctx.moveTo(x,y+k);ctx.lineTo(x,y);ctx.lineTo(x+k,y);
  ctx.moveTo(x+w-k,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+k);
  ctx.moveTo(x+w,y+h-k);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-k,y+h);
  ctx.moveTo(x+k,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-k);
  ctx.stroke();
  ctx.fillRect(x+w/2-30,y-3,60,3);
  ctx.restore();
}
function txt(s,x,y,size,col,align='left',glow=true){
  ctx.save();ctx.font=`bold ${size}px "Courier New",monospace`;
  ctx.fillStyle=col;ctx.textAlign=align;
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=10;}
  ctx.fillText(s,x,y);ctx.restore();
}
function overlay(title,sub,hint){
  ctx.fillStyle='rgba(3,4,10,0.82)';ctx.fillRect(BX,BY,COLS*CS,ROWS*CS);
  txt(title,BX+COLS*CS/2,BY+ROWS*CS/2-30,22,C.cyan,'center');
  if(sub)txt(sub,BX+COLS*CS/2,BY+ROWS*CS/2+4,14,C.white,'center',false);
  if(hint)txt(hint,BX+COLS*CS/2,BY+ROWS*CS/2+40,13,C.pink,'center');
}

function render(){
  ctx.fillStyle='#03040a';ctx.fillRect(0,0,W,H);

  // полосы авроры
  for(let i=0;i<3;i++){
    ctx.save();ctx.strokeStyle=i===1?C.pink:C.cyan;ctx.globalAlpha=0.06+0.02*i;ctx.lineWidth=40;
    ctx.beginPath();
    for(let x=0;x<=W;x+=12){
      const y=H*0.12+i*90+Math.sin(x*0.008+clock*0.6+i*1.7)*30;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();ctx.restore();
  }
  for(const p of petals)petal(p.x,p.y,p.r,p.rot,0.5);

  // рамки HUD (как на референсах)
  hud(BX-12,BY-12,COLS*CS+24,ROWS*CS+24,C.cyan);

  // поле
  ctx.fillStyle='rgba(5,10,20,0.7)';ctx.fillRect(BX,BY,COLS*CS,ROWS*CS);
  ctx.strokeStyle='rgba(63,243,255,0.06)';ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(BX+x*CS,BY);ctx.lineTo(BX+x*CS,BY+ROWS*CS);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(BX,BY+y*CS);ctx.lineTo(BX+COLS*CS,BY+y*CS);ctx.stroke();}

  if(started){
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const b=board[y][x];
      if(b)drawCell(BX+x*CS,BY+y*CS,b.c,1,b.b);
    }
    // призрак
    let gy=cur.y;
    while(!collide(cur.m,cur.x,gy+1))gy++;
    let mk=false;
    for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++){
      if(!cur.m[r][c])continue;
      drawCell(BX+(cur.x+c)*CS,BY+(gy+r)*CS,cur.c,0.18,null);
    }
    // текущая фигура
    for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++){
      if(!cur.m[r][c])continue;
      const mark=(!mk&&cur.bonus)?cur.bonus:null;
      if(mark)mk=true;
      drawCell(BX+(cur.x+c)*CS,BY+(cur.y+r)*CS,cur.c,1,mark);
    }
    // туман — видно только рядом с фигурой
    if(T.fog>0){
      const cx=BX+(cur.x+cur.m[0].length/2)*CS,cy=BY+(cur.y+cur.m.length/2)*CS;
      const g=ctx.createRadialGradient(cx,cy,30,cx,cy,170);
      g.addColorStop(0,'rgba(3,4,10,0)');g.addColorStop(1,'rgba(3,4,10,0.97)');
      ctx.fillStyle=g;ctx.fillRect(BX,BY,COLS*CS,ROWS*CS);
    }
    // глитч-полосы
    if(T.glitch>0){
      for(let i=0;i<4;i++){
        const y=BY+Math.random()*ROWS*CS;
        ctx.fillStyle='rgba(255,61,110,0.12)';ctx.fillRect(BX,y,COLS*CS,2+Math.random()*4);
      }
    }
    // перегрузка — красно-розовая рамка
    if(T.surge>0){
      ctx.save();ctx.strokeStyle=C.pink;ctx.lineWidth=3;ctx.shadowColor=C.pink;ctx.shadowBlur=18;
      ctx.strokeRect(BX+2,BY+2,COLS*CS-4,ROWS*CS-4);ctx.restore();
    }
    if(flash>0){ctx.fillStyle=`rgba(255,240,250,${flash*0.5})`;ctx.fillRect(BX,BY,COLS*CS,ROWS*CS);}
    if(banner){
      ctx.save();ctx.globalAlpha=Math.min(1,banner.dur/0.4);
      txt(banner.t,BX+COLS*CS/2,BY+44,14,banner.col,'center');ctx.restore();
    }
  }

  // боковая панель
  const X=352;
  hud(X-10,BY-12,150,ROWS*CS+24,C.white);
  txt('СЧЁТ',X,BY+10,11,C.cyan);txt(String(score),X,BY+32,22,'#fff',"left",false);
  txt('УРОВЕНЬ',X,BY+70,11,C.cyan);txt(String(level),X,BY+92,22,'#fff',"left",false);
  txt('ЛИНИИ',X,BY+130,11,C.cyan);txt(String(lines||0),X,BY+152,22,'#fff',"left",false);
  txt('СЛЕДУЮЩИЙ',X,BY+200,11,C.cyan);
  if(nxt){
    const m=nxt.m,sz=18,w=m[0].length*sz,ox=X+(130-w)/2,oy=BY+212;
    for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)
      if(m[r][c])drawCell(ox+c*sz,oy+r*sz,nxt.c,1,null,sz);
  }
  txt('ЩИТЫ',X,BY+300,11,C.cyan);
  for(let i=0;i<3;i++){
    ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=1.5;
    rr(X+i*42,BY+312,34,16,3);
    if(i<shield){ctx.fillStyle=C.gold;ctx.shadowColor=C.gold;ctx.shadowBlur=10;ctx.fill();}
    ctx.stroke();ctx.restore();
  }
  let ty=BY+352;
  for(const k of Object.keys(T)){
    if(T[k]<=0)continue;
    txt(TNAME[k],X,ty,10,C.pink);
    ctx.fillStyle='rgba(255,111,193,0.25)';ctx.fillRect(X,ty+4,120,6);
    ctx.fillStyle=C.pink;ctx.fillRect(X,ty+4,120*(T[k]/TMAX[k]),6);
    ty+=24;
  }
  // легенда бонусов
  let ly=BY+ROWS*CS-120;
  txt('БОНУСЫ',X,ly,10,C.cyan);
  for(const k of Object.keys(BON)){
    ly+=20;
    ctx.fillStyle=BON[k].c;ctx.beginPath();ctx.arc(X+5,ly-4,4,0,Math.PI*2);ctx.fill();
    txt(BON[k].n,X+16,ly,10,BON[k].c,'left',false);
  }
  // управление
  txt('← → движение',X,BY+ROWS*CS+18,9,C.white,'left',false);
  txt('↑ / X  поворот',X,BY+ROWS*CS+32,9,C.white,'left',false);
  txt('↓ мягко  ПРОБЕЛ жёстко',X,BY+ROWS*CS+46,9,C.white,'left',false);
  txt('P  пауза',X,BY+ROWS*CS+60,9,C.white,'left',false);

  // экраны состояний
  if(!started)overlay('AVRORA BLOCKS','КИБЕРПАНК-ТЕТРИС','ENTER / ТАП — СТАРТ');
  else if(over)overlay('СИСТЕМА ПЕРЕГРУЖЕНА','СЧЁТ: '+score,'ENTER / ТАП — ЗАНОВО');
  else if(paused)overlay('ПАУЗА',null,'P — продолжить');
}

/* ---------- управление ---------- */
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',
  ArrowUp:'rot',KeyW:'rot',KeyX:'rot',Space:'drop',KeyP:'pause',Enter:'start'};
addEventListener('keydown',e=>{
  const a=KEYS[e.code];if(!a)return;
  e.preventDefault();
  if(a==='pause'){if(started&&!over)paused=!paused;return;}
  if(a==='start'||!started||over){start();return;}
  act(a);
});
document.querySelectorAll('#pad button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.k);});
});
let sx=0,sy=0;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
cv.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(!started||over){start();return;}
  if(paused){paused=false;return;}
  if(Math.hypot(dx,dy)<12)act('rot');
  else if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');
  else if(dy>60)act('drop');
  else if(dy>20)act('down');
});

function loop(t){
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  if(started&&!over&&!paused)update(dt);
  for(const p of petals){
    p.y+=p.vy*dt*60;p.x+=p.vx*dt*60+Math.sin(clock+p.y*0.02)*0.3;p.rot+=p.vr*dt;
    if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
